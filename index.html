<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第26届金相大会 · 交互式问答</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5.2.10/index.css" rel="stylesheet">
<style>
:root{
  --bg:#14161a;--surface:#1c1f25;--surface2:#23272e;--border:rgba(255,255,255,.09);
  --text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.55);--faint:rgba(255,255,255,.35);
  --accent:#e8a04a;--accent-soft:rgba(232,160,74,.14);
  --ok:#4cc38a;--bad:#e5484d;--warn:#f5a623;
  --radius:14px;--radius-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Noto Sans SC Variable","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.6;min-height:100vh;
}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}
header.top{margin-bottom:24px}
header.top h1{font-size:22px;font-weight:600;letter-spacing:.5px}
header.top h1 span{color:var(--accent)}
header.top p{font-size:13px;color:var(--muted);margin-top:4px}

/* selector bar */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.bar select{
  flex:1;min-width:220px;height:40px;padding:0 12px;font-size:14px;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);outline:none;
}
.bar button{
  height:40px;padding:0 16px;font-size:13px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-s);cursor:pointer;transition:background .15s;
}
.bar button:hover:not(:disabled){background:var(--surface2)}
.bar button:disabled{opacity:.4;cursor:not-allowed}

/* info card */
.info{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:24px}
.info .steel{font-size:20px;font-weight:600;color:var(--accent)}
.info .item{font-size:13px;color:var(--muted)}
.info .item b{color:var(--text);font-weight:500;margin-left:4px}
.pill{font-size:12px;padding:3px 12px;border-radius:999px;font-weight:500}
.pill.ok{background:rgba(76,195,138,.15);color:var(--ok)}
.pill.bad{background:rgba(229,72,77,.15);color:var(--bad)}
.pill.warn{background:rgba(245,166,35,.15);color:var(--warn)}

/* question sections */
.qsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.qsec .qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px}
.qsec .qnum{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:1px;margin-bottom:4px}
.qsec .qtitle{font-size:15px;font-weight:500;line-height:1.5}
.qsec .qhint{font-size:12px;color:var(--faint);margin-top:4px}
.reveal{
  flex-shrink:0;height:34px;padding:0 18px;font-size:13px;font-weight:500;color:var(--accent);
  background:var(--accent-soft);border:1px solid rgba(232,160,74,.3);border-radius:999px;cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
}
.reveal:hover{background:rgba(232,160,74,.25)}
.reveal.open{background:var(--accent);color:#1a1206}
.answer{max-height:0;overflow:hidden;transition:max-height .35s ease}
.answer .inner{padding:4px 18px 18px;border-top:1px solid var(--border);margin:0 0;font-size:13.5px;color:var(--muted);line-height:1.8}
.answer .inner b{color:var(--text);font-weight:500}
.answer.open{max-height:3000px}
.answer .inner{padding-top:14px}

footer{margin-top:32px;text-align:center;font-size:12px;color:var(--faint)}
@media(max-width:600px){
  .wrap{padding:20px 14px 60px}
  .qsec .qhead{flex-direction:column}
  .reveal{align-self:flex-start}
  .info{padding:14px 16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>第<span>26</span>届金相大会 · 交互式问答</h1>
    <p>先看钢号与硬度 → 默念热处理流程与组织 → 点击「看答案」逐题核对</p>
  </header>

  <div class="bar">
    <select id="sel"></select>
    <button id="prev">← 上一题</button>
    <button id="next">下一题 →</button>
  </div>

  <div class="info" id="info">
    <div class="steel" id="steelName">—</div>
    <div class="item">硬度<b id="hardness">—</b></div>
    <div class="item">达标情况<span id="passPill" class="pill ok">—</span></div>
    <div class="item">进度<b id="progress">—</b></div>
  </div>

  <div id="qlist"></div>
  <footer>内容来源：《26金相大会比赛一》 · 共 19 题</footer>
</div>

<script>
const DATA=[
/* 1 */

 {t:"硬度测试是多少？是否达标？分析原因",h:"对照国标判断并解释强化机制",
  a:"实测硬度 <b>67HRB</b>，GB/T 699-2015 规定20钢退火态硬度应低于73HRB，<b>合格</b>。<br>原因：①珠光体是铁素体和渗碳体组成的片层状机械混合物，片层越细硬度越高，本样品片层间距150~350nm；渗碳体是金属间化合物，碳原子产生极强晶格畸变，硬度可达800HV以上；②铁素体是体心立方结构，滑移系48个，塑性好、硬度偏低；③铁素体和珠光体面积约3:1，整体硬度较低。"},
 {t:"热处理工艺与组织形成过程",h:"加热→保温→冷却全过程",
  a:"<b>工艺：完全退火</b>。按 T=αKD 估算，880~900℃保温30~45min，随炉缓冷。<br>形成过程：①加热至Ac1以上，珠光体片层上奥氏体形核并长大；升至Ac3以上，残余渗碳体溶解，先共析铁素体融入奥氏体，成分均匀化。②随炉缓冷至Ar3以下，奥氏体晶界析出先共析铁素体；冷至Ar1以下，奥氏体发生共析扩散型不连续均匀脱溶，形成珠光体，面积比约3:1。<br>组织特征：等轴状铁素体 + 片层状珠光体（片层间距150~350nm）。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并举例",
  a:"20钢塑性韧性好、焊接性能好，但淬透性差。该样品退火态组织均匀、硬度达标，属合格品，可用作冷冲压、热轧型材。<br>用途举例：<b>管道冲压法兰、电机薄壁外壳</b>（也可作螺母垫片、低压输送管道等）。"}]},
/* 2 */
{s:"20钢（淬火）",h:"47HRC",pass:"bad",pt:"不合格（超标）",
 qs:[
 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",
  a:"<b>20钢（淬火态）</b>"},
 {t:"标注组织组成物名称",h:"识别灰度照片中的相与组织",

 {t:"硬度测试是多少？是否达标？分析原因",h:"对照行业标准判断",
  a:"平均硬度 <b>47HRC</b>，JB/T 6609-2021 规定20钢淬火后硬度30~36HRC，<b>超标，不合格</b>。<br>原因：马氏体是碳在α-Fe中的过饱和固溶体（固溶强化）；板条马氏体内部存在高密度位错（位错强化）；淬火后马氏体晶粒细小（细晶强化）。"},

 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"20钢淬透性差（淬透层仅4~7mm）、淬硬性差，直接淬火无法使用。该样品仅表层淬透，内部可能存在非马氏体组织，且硬度超标（推测表层加工硬化、成分偏差或盐水淬火所致），<b>不合格</b>。<br>工艺改进：920℃渗碳后降温至860~880℃盐水淬火或分级淬火，避免表层开裂并获得较深马氏体层，200℃回火1~2h。<br>用途：<b>汽车变速箱小齿轮、小型低速齿轮</b>。"}]},
/* 3 */
{s:"45钢（退火）",h:"82HRB",pass:"ok",pt:"合格",
 qs:[
 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",
  a:"<b>45钢（退火态）</b>"},
 {t:"标注组织组成物名称",h:"识别灰度照片中的相与组织",
  a:"<b>铁素体 + 珠光体</b>（灰度照片）"},

  a:"实测 <b>82HRB</b>，GB/T 699-2015 规定45钢退火态硬度低于93HRB，<b>合格</b>。<br>原因：①珠光体片层间距150~350nm，渗碳体硬度可达800HV以上；②铁素体体心立方、滑移系48个，硬度低；③珠光体与铁素体约各占一半，综合硬度较低。"},

 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并举例",

 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",

 {t:"标注组织组成物名称",h:"识别灰度照片中的相与组织",

 {t:"硬度测试是多少？是否达标？分析原因",h:"对照国标判断并解释",

  a:"<b>工艺：正火</b>。840~860℃保温15~30min，空冷。<br>形成过程：①加热至Ac3以上奥氏体化并均匀化。②出炉空冷，冷至Ar3以下晶界析出先共析铁素体；冷至Ar1以下，因过冷度较大，形成片层较细的索氏体组织（含碳量<0.77%）。<br>组织特征：①沿晶界析出大量块状先共析铁素体；②晶粒度3~4级的等轴索氏体（面积超过一半）；③圆心偏析、索氏体较多并有轻微带状组织，边缘轻微脱碳。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",

 qs:[
 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",

 {t:"硬度测试是多少？是否达标？分析原因",h:"对照行业标准判断",
  a:"实测 <b>48HRC</b>，JB/T 6609-2021 规定有效厚度10~20mm油淬样品表层硬度45~52HRC，<b>达标</b>。<br>原因：①马氏体固溶强化；②板条马氏体高密度位错；③马氏体细晶强化；④孪晶马氏体微细孪晶进一步提高硬度；⑤屈氏体片层间距小（30~80nm），细晶强化+渗碳体片层提供较高硬度；⑥上贝氏体硬度略高于屈氏体。大量板条马氏体+少量针片马氏体+屈氏体+上贝氏体形成较高硬度的复杂组织。"},
 {t:"热处理工艺与组织形成过程",h:"油冷冷速不足带来的混合组织",
  a:"<b>工艺：油淬</b>。840~860℃保温15~30min，奥氏体化后油冷。<br>形成过程：①加热奥氏体化。②油冷淬火，冷速处于马氏体临界冷速附近：样品外部冷速高马氏体占比高，向内冷速降低屈氏体增多；心部含碳量高（更接近共析成分）、临界冷速更低，马氏体反而更多；屈氏体沿晶界分布（晶界扩散快、形核功低、碳偏聚）。③极少量上贝氏体：冷却经过350~550℃区间时冷速较慢（淬火油温度较高或牌号粘度大冷速低）。④整体Ms点低于室温，存在亚稳残余奥氏体。<br>组织特征：心部沿晶界少量屈氏体+混合马氏体（晶粒粗大）；向外网状屈氏体增多再减少；近边缘屈氏体+混合马氏体；深黑色半羽毛状上贝氏体由晶界向晶内延伸（含量极少）；边缘轻微脱碳。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",

 {t:"热处理工艺与组织形成过程",h:"淬火裂纹的形成",
  a:"<b>工艺：淬火</b>。840~860℃保温15~30min，取出水冷。<br>形成过程：加热至Ac1以上奥氏体大量形核；升至Ac3以上奥氏体长大、铁素体融入；840~860℃保温，残余渗碳体溶解、成分均匀化；水冷淬火，奥氏体无扩散共格切变形成板条马氏体和针片马氏体；部分高碳微区Ms低于室温，留存少量残余奥氏体；淬火经高温区与低温区冷速差异大，边缘出现<b>沿晶+穿晶混合淬火裂纹</b>。<br>组织特征：板条马氏体平行呈深色，一个原奥氏体晶粒内多个板条束群；少量亮色残余奥氏体；高碳针片马氏体零散分布；外边缘2mm处大量深色自回火低碳马氏体（残余奥氏体极少）；边缘轻微脱碳层；边缘淬火裂纹；圆心处沿晶界析出深色屈氏体。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",

 {t:"热处理工艺与组织形成过程",h:"过热淬火与沿晶裂纹",

 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",

  a:"<b>工艺：淬火+低温回火</b>。840~860℃保温15~30min水冷淬火，200℃保温1~2h回火。<br>形成过程：淬火得到板条马氏体+高碳微区针片马氏体+少量残余奥氏体；回火加热时部分残余奥氏体转变为马氏体，马氏体中过饱和碳析出，形成<b>回火马氏体</b>，内部分散极弥散细小的ε碳化物，腐蚀后颜色偏深。<br>组织特征：回火板条马氏体板条平行呈深色，一个原奥氏体晶粒内多个板条束群；少量边缘尖锐回火针片马氏体（含量少难分辨）；极少量浅色残余奥氏体无明显边界；边缘轻微脱碳层。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并举例",

 {t:"热处理工艺与组织形成过程",h:"中温回火的碳化物演变",
  a:"<b>工艺：淬火+中温回火</b>。因硬度偏低，推测840~860℃保温15~30min水冷后，在500℃保温超过2h或温度略高于500℃回火。<br>形成过程：淬火得到板条马氏体+针片马氏体+少量残余奥氏体；中温回火时依次发生：过饱和碳析出→碳原子在位错线附近偏聚→ε碳化物→χ碳化物→θ碳化物；因温度偏高或时间偏长，碳化物略微球化，形成<b>回火屈氏体</b>。残余奥氏体部分转变为马氏体，少量通过切变+扩散混合机制形成下贝氏体、分解为回火屈氏体。<br>组织特征：铁素体板条内部和界面上弥散分布极细小θ碳化物，保持部分马氏体形态，板条状铁素体内部存在高密度位错。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"回火温度可能达到520℃或保温时间过长，碳化物球化导致硬度偏低（低于行业35~45HRC范围），<b>不达标</b>。<br>工艺改进：重新奥氏体化后淬火+中温回火，回火温度控制在<b>350~500℃</b>、保温<b>1~2h</b>。<br>用途：合格件可用作<b>小型弹簧</b>等弹性零件。"}]},

 {t:"热处理工艺与组织形成过程",h:"调质处理与过回火现象",
  a:"<b>工艺：淬火+高温回火（调质）</b>。因硬度偏低，推测回火温度高于650℃或保温时间太久。<br>形成过程：淬火得到板条马氏体+针片马氏体+少量残余奥氏体；高温回火时依次发生：过饱和碳析出→位错偏聚→ε碳化物→χ碳化物→θ碳化物→渗碳体聚集长大（奥斯特瓦尔德熟化）；因温度偏高或时间偏长，基体完全丧失马氏体形态，铁素体重新形核长大为游离块状铁素体，形成<b>回火索氏体</b>。残余奥氏体部分转马氏体、少量形成下贝氏体、分解为回火索氏体。<br>组织特征：左半部分为游离块状铁素体+渗碳体颗粒（完全丧失马氏体形态）；右半部分为铁素体基体+颗粒碳化物的回火索氏体。"},

const $=id=>document.getElementById(id);
let cur=0,opened={};

function buildSel(){
  DATA.forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=i;o.textContent=(i+1)+'. '+d.s+' — '+d.h;
    $('sel').appendChild(o);
  });
}

function render(i){
  cur=i;const d=DATA[i];
  $('sel').value=i;
  $('steelName').textContent=d.s;
  $('hardness').textContent=d.h;
  const pill=$('passPill');
  pill.textContent=d.pt;
  pill.className='pill '+d.pass;
  $('progress').textContent='第 '+(i+1)+' / '+DATA.length+' 题';
  let h='';
  d.qs.forEach((q,j)=>{
    const key=i+'-'+j,isOpen=!!opened[key];
    h+='<div class="qsec"><div class="qhead"><div><div class="qnum">Q'+(j+1)+'</div>'+
       '<div class="qtitle">'+q.t+'</div><div class="qhint">💭 默念提示：'+q.h+'</div></div>'+
       '<button class="reveal'+(isOpen?' open':'')+'" data-key="'+key+'">'+(isOpen?'收起答案':'看答案')+'</button></div>'+
       '<div class="answer'+(isOpen?' open':'')+'" id="ans-'+key+'"><div class="inner">'+q.a+'</div></div></div>';
  });
  $('qlist').innerHTML=h;
  $('qlist').querySelectorAll('.reveal').forEach(b=>{
    b.addEventListener('click',()=>{
      const key=b.dataset.key,ans=$('ans-'+key);
      const nowOpen=!opened[key];
      opened[key]=nowOpen;
      ans.classList.toggle('open',nowOpen);
      b.classList.toggle('open',nowOpen);
      b.textContent=nowOpen?'收起答案':'看答案';
    });
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

buildSel();render(0);
$('sel').addEventListener('change',e=>render(+e.target.value));
$('prev').addEventListener('click',()=>{if(cur>0)render(cur-1)});
$('next').addEventListener('click',()=>{if(cur<DATA.length-1)render(cur+1)});
</script>
</body>
</html>
