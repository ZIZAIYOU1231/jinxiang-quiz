<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金相大会比赛一背诵版 · 佛山大学</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5.2.10/index.css" rel="stylesheet">
<style>
:root{
  --bg:#1e0f14;--surface:#2c151d;--surface2:#3a1c26;--border:rgba(255,255,255,.09);
  --text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.55);--faint:rgba(255,255,255,.35);
  --accent:#d4577a;--accent-soft:rgba(212,87,122,.15);
  --ok:#4cc38a;--bad:#e5484d;--warn:#f5a623;--info:#5aa9e6;
  --radius:14px;--radius-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans SC Variable","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:22px;font-weight:600;letter-spacing:.5px}
header.top h1 span{color:var(--accent)}
header.top p{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px}
.tabs button{height:34px;padding:0 16px;font-size:13px;color:var(--muted);background:transparent;border:none;border-radius:999px;cursor:pointer;transition:all .15s}
.tabs button.active{background:var(--accent);color:#fff;font-weight:500}

/* stats bar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat .num{font-size:20px;font-weight:600;color:var(--accent)}
.stat .lab{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat .num.ok{color:var(--ok)}.stat .num.bad{color:var(--bad)}

/* SRS card */
.stage{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-height:340px;display:flex;flex-direction:column}
.stage .meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stage .steel{font-size:19px;font-weight:600;color:var(--accent)}
.stage .item{font-size:13px;color:var(--muted)}
.stage .item b{color:var(--text);font-weight:500;margin-left:4px}
.pill{font-size:12px;padding:3px 12px;border-radius:999px;font-weight:500}
.pill.ok{background:rgba(76,195,138,.15);color:var(--ok)}
.pill.bad{background:rgba(229,72,77,.15);color:var(--bad)}
.pill.warn{background:rgba(245,166,35,.15);color:var(--warn)}
.ivl{font-size:12px;color:var(--faint)}
.fliparea{flex:1;position:relative;cursor:pointer}
.front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:30px 10px}
.front .big{font-size:17px;font-weight:500;line-height:1.7}
.front .tip{font-size:13px;color:var(--faint)}
.front .qwalk{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;margin-top:6px}
.qw{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 14px;font-size:13.5px;text-align:left}
.qw .qn{color:var(--accent);font-weight:600;flex-shrink:0;font-size:12px;margin-top:2px}
.qw .qt{color:var(--text)}
.qw .qh{color:var(--faint);font-size:12px}
.flipbtn{height:42px;padding:0 32px;font-size:14px;font-weight:500;color:#fff;background:var(--accent);border:none;border-radius:999px;cursor:pointer;transition:filter .15s}
.flipbtn:hover{filter:brightness(1.1)}
.answers{display:none}
.answers.show{display:block}
.answers .asec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px 16px;margin-bottom:10px;font-size:13.5px;color:var(--muted);line-height:1.8}
.answers .asec b{color:var(--text);font-weight:500}
.answers .asec .at{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:1px;margin-bottom:4px}
.rate{display:none;gap:10px;margin-top:16px}
.rate.show{display:flex}
.rate button{flex:1;height:52px;border-radius:var(--radius-s);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rate button small{font-size:11px;font-weight:400;opacity:.75}
.rate .again{background:rgba(229,72,77,.12);color:var(--bad)}
.rate .hard{background:rgba(245,166,35,.12);color:var(--warn)}
.rate .good{background:rgba(76,195,138,.12);color:var(--ok)}
.rate .easy{background:rgba(90,169,230,.12);color:var(--info)}
.rate button:hover{filter:brightness(1.25)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--faint)}
.navrow .btns{display:flex;gap:8px}
.navrow button{height:32px;padding:0 14px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);cursor:pointer}
.navrow button:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.navrow button:disabled{opacity:.35;cursor:not-allowed}
.done{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:60px 20px;flex:1}
.done.show{display:flex}
.done .big{font-size:40px}
.done p{color:var(--muted);font-size:14px}

/* browse mode (original) */
#view-browse{display:none}
.steelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.steelgrid button{padding:10px 8px;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);cursor:pointer;transition:all .15s;line-height:1.4}
.steelgrid button small{display:block;color:var(--faint);font-size:11px}
.steelgrid button:hover{border-color:var(--accent);color:var(--accent)}
.steelgrid button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.steelgrid button.active small{color:rgba(255,255,255,.75)}
.gridtip{font-size:12px;color:var(--faint);margin-bottom:14px}
#view-browse.show{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.bar select{flex:1;min-width:220px;height:40px;padding:0 12px;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);outline:none}
.bar button{height:40px;padding:0 16px;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);cursor:pointer}
.bar button:hover:not(:disabled){background:var(--surface2)}
.bar button:disabled{opacity:.4;cursor:not-allowed}
.info{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:24px}
.info .steel{font-size:20px;font-weight:600;color:var(--accent)}
.info .item{font-size:13px;color:var(--muted)}
.info .item b{color:var(--text);font-weight:500;margin-left:4px}
.info .pill{margin-left:4px}
.qsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.qsec .qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px}
.qsec .qnum{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:1px;margin-bottom:4px}
.qsec .qtitle{font-size:15px;font-weight:500;line-height:1.5}
.qsec .qhint{font-size:12px;color:var(--faint);margin-top:4px}
.reveal{flex-shrink:0;height:34px;padding:0 18px;font-size:13px;font-weight:500;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(212,87,122,.35);border-radius:999px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.reveal:hover{background:rgba(212,87,122,.28)}
.reveal.open{background:var(--accent);color:#fff}
.answer{max-height:0;overflow:hidden;transition:max-height .35s ease}
.answer .inner{padding:14px 18px 18px;border-top:1px solid var(--border);font-size:13.5px;color:var(--muted);line-height:1.8}
.answer .inner b{color:var(--text);font-weight:500}
.answer.open{max-height:3000px}

/* deck list */
.decklist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 14px;font-size:13px}
.drow .dn{color:var(--faint);width:26px;flex-shrink:0}
.drow .ds{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dm{flex-shrink:0}
.mbar{width:110px;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.duechip{font-size:11px;padding:2px 10px;border-radius:999px;flex-shrink:0}
.duechip.due{background:rgba(229,72,77,.15);color:var(--bad)}
.duechip.later{background:rgba(255,255,255,.06);color:var(--faint)}
.mstat{font-size:11.5px;color:var(--muted);width:56px;text-align:right;flex-shrink:0}
footer{margin-top:32px;text-align:center;font-size:12px;color:var(--faint)}
footer .reset{color:var(--bad);cursor:pointer;text-decoration:underline;margin-left:8px}
@media(max-width:600px){
  .wrap{padding:18px 12px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qsec .qhead{flex-direction:column}
  .reveal{align-self:flex-start}
  .info{padding:14px 16px}
  .rate{flex-wrap:wrap}
  .rate button{min-width:calc(50% - 5px)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;gap:12px">
      <svg width="52" height="52" viewBox="0 0 100 100" aria-label="佛山大学校标">
        <circle cx="50" cy="50" r="47" fill="none" stroke="#d4577a" stroke-width="4"/>
        <circle cx="50" cy="50" r="33" fill="none" stroke="#d4577a" stroke-width="2.5"/>
        <path d="M50 30 C42 42 40 50 44 58 C46 52 49 49 50 47 C51 49 54 52 56 58 C60 50 58 42 50 30 Z" fill="#d4577a"/>
        <path d="M50 47 C46 55 44 62 50 70 C56 62 54 55 50 47 Z" fill="#d4577a" opacity=".75"/>
        <text x="50" y="84" text-anchor="middle" font-size="9" fill="#d4577a" font-family="sans-serif">FOSHAN UNIV. 1958</text>
      </svg>
      <div>
      <h1>金相大会比赛一<span>背诵版</span></h1>
      <p>间隔重复背诵：看卡片提示 → 默念五问答案 → 翻面核对 → 按记忆情况评分</p>
    </div></div>
    <div class="tabs">
      <button id="tab-srs" class="active">背诵模式</button>
      <button id="tab-deck">掌握度</button>
      <button id="tab-browse">浏览模式</button>
    </div>
  </header>

  <div id="view-srs">
    <div class="stats">
      <div class="stat"><div class="num" id="stDue">—</div><div class="lab">今日待复习</div></div>
      <div class="stat"><div class="num ok" id="stMastered">—</div><div class="lab">已掌握</div></div>
      <div class="stat"><div class="num" id="stLearning">—</div><div class="lab">学习中</div></div>
      <div class="stat"><div class="num bad" id="stNew">—</div><div class="lab">未开始</div></div>
    </div>

    <div class="stage" id="stage">
      <div class="meta">
        <div class="steel" id="cSteel">—</div>
        <div class="item">硬度<b id="cHard">—</b></div>
        <span class="pill ok" id="cPass">—</span>
        <div class="ivl" id="cIvl"></div>
      </div>
      <div class="fliparea" id="flipArea">
        <div class="front" id="front">
          <div class="big">默念以下五问的完整答案</div>
          <div class="qwalk" id="qwalk"></div>
          <div class="tip">先在脑中过一遍 → 再点击翻面核对</div>
          <button class="flipbtn" id="flipBtn">翻面核对</button>
        </div>
        <div class="answers" id="answers"></div>
        <div class="done" id="done">
          <div class="big">🎉</div>
          <div class="big" style="font-size:20px">今日队列已完成！</div>
          <p id="doneMsg">可切换到「掌握度」查看复习计划，或稍后再来复习到期卡片。</p>
          <button class="flipbtn" id="againBtn" style="margin-top:8px">再背一轮（乱序）</button>
        </div>
      </div>
      <div class="rate" id="rate">
        <button class="again" data-r="0">忘记<small>&lt;10min</small></button>
        <button class="hard" data-r="1">模糊<small>1天</small></button>
        <button class="good" data-r="2">记得<small id="gIvl">3天</small></button>
        <button class="easy" data-r="3">轻松<small id="eIvl">7天</small></button>
      </div>
      <div class="navrow">
        <span id="posLabel">—</span>
        <div class="btns">
          <button id="skipBtn">跳过</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-deck">
    <div class="decklist" id="decklist"></div>
  </div>

  <div id="view-browse">
    <div class="steelgrid" id="steelGrid"></div>
    <p class="gridtip">点击任一钢种即可查看该种类的全部内容</p>
    <div class="info">
      <div class="steel" id="steelName">—</div>
      <div class="item">硬度<b id="hardness">—</b></div>
      <div class="item">达标情况<span id="passPill" class="pill ok">—</span></div>
      <div class="item">进度<b id="progress">—</b></div>
    </div>
    <div id="qlist"></div>
  </div>

  <footer>内容来源：《26金相大会比赛一》 · 佛山大学 · 共 19 题 · 复习进度保存在本机浏览器<span class="reset" id="resetBtn">重置全部进度</span></footer>
</div>

<script>
const DATA=[
/* 1 */
{s:"20钢（退火）",h:"67HRB",pass:"ok",pt:"合格",
 qs:[
 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",
  a:"<b>20钢（退火态）</b>"},
 {t:"标注组织组成物名称",h:"识别灰度照片中的相与组织",
  a:"<b>铁素体 + 珠光体</b>（灰度照片）"},
 {t:"硬度测试是多少？是否达标？分析原因",h:"对照国标判断并解释强化机制",
  a:"实测硬度 <b>67HRB</b>，GB/T 699-2015 规定20钢退火态硬度应低于73HRB，<b>合格</b>。<br>原因：①珠光体是铁素体和渗碳体组成的片层状机械混合物，片层越细硬度越高，本样品片层间距150~350nm；渗碳体是金属间化合物，碳原子产生极强晶格畸变，硬度可达800HV以上；②铁素体是体心立方结构，滑移系48个，塑性好、硬度偏低；③铁素体和珠光体面积约3:1，整体硬度较低。"},
 {t:"热处理工艺与组织形成过程",h:"加热→保温→冷却全过程",
  a:"<b>工艺：完全退火</b>。按 T=αKD 估算，880~900℃保温30~45min，随炉缓冷。<br>形成过程：①加热至Ac1以上，珠光体片层上奥氏体形核并长大；升至Ac3以上，残余渗碳体溶解，先共析铁素体融入奥氏体，成分均匀化。②随炉缓冷至Ar3以下，奥氏体晶界析出先共析铁素体；冷至Ar1以下，奥氏体发生共析扩散型不连续均匀脱溶，形成珠光体，面积比约3:1。<br>组织特征：等轴状铁素体 + 片层状珠光体（片层间距150~350nm）。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并举例",
  a:"20钢塑性韧性好、焊接性能好，但淬透性差。该样品退火态组织均匀、硬度达标，属合格品，可用作冷冲压、热轧型材。<br>用途举例：<b>管道冲压法兰、电机薄壁外壳</b>（也可作螺母垫片、低压输送管道等）。"}]},
/* 2 */
{s:"20钢（淬火）",h:"47HRC",pass:"bad",pt:"不合格（超标）",
 qs:[
 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",
  a:"<b>20钢（淬火态）</b>"},
 {t:"标注组织组成物名称",h:"识别灰度照片中的相与组织",
  a:"<b>板条马氏体 + 残余奥氏体</b>（灰度照片）"},
 {t:"硬度测试是多少？是否达标？分析原因",h:"对照行业标准判断",
  a:"平均硬度 <b>47HRC</b>，JB/T 6609-2021 规定20钢淬火后硬度30~36HRC，<b>超标，不合格</b>。<br>原因：马氏体是碳在α-Fe中的过饱和固溶体（固溶强化）；板条马氏体内部存在高密度位错（位错强化）；淬火后马氏体晶粒细小（细晶强化）。"},
 {t:"热处理工艺与组织形成过程",h:"推测加热温度与冷却方式",
  a:"<b>工艺：920℃加热淬火</b>，保温15~30min，水冷。<br>形成过程：加热至Ac1以上，珠光体片层上奥氏体大量形核；升至Ac3以上，残余渗碳体溶解，先共析铁素体融入奥氏体并均匀化；920℃保温后水冷，奥氏体发生无扩散共格切变形成板条马氏体；部分高碳微区因Ms点低于室温且受先形成马氏体挤压，无法转变，形成极少量残余奥氏体。<br>组织特征：马氏体板条相互平行呈深色，一个原奥氏体晶粒内存在多个板条束；极少量不规则亮色残余奥氏体无明显边界；边缘轻微脱碳层（边缘冷速过快、自回火受抑制）。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"20钢淬透性差（淬透层仅4~7mm）、淬硬性差，直接淬火无法使用。该样品仅表层淬透，内部可能存在非马氏体组织，且硬度超标（推测表层加工硬化、成分偏差或盐水淬火所致），<b>不合格</b>。<br>工艺改进：920℃渗碳后降温至860~880℃盐水淬火或分级淬火，避免表层开裂并获得较深马氏体层，200℃回火1~2h。<br>用途：<b>汽车变速箱小齿轮、小型低速齿轮</b>。"}]},
/* 3 */
{s:"45钢（退火）",h:"82HRB",pass:"ok",pt:"合格",
 qs:[
 {t:"属于哪一种钢",h:"根据组织与硬度判断钢号",
  a:"<b>45钢（退火态）</b>"},
 {t:"标注组织组成物名称",h:"识别灰度照片中的相与组织",
  a:"<b>铁素体 + 珠光体</b>（灰度照片）"},
 {t:"硬度测试是多少？是否达标？分析原因",h:"对照国标判断并解释",
  a:"实测 <b>82HRB</b>，GB/T 699-2015 规定45钢退火态硬度低于93HRB，<b>合格</b>。<br>原因：①珠光体片层间距150~350nm，渗碳体硬度可达800HV以上；②铁素体体心立方、滑移系48个，硬度低；③珠光体与铁素体约各占一半，综合硬度较低。"},
 {t:"热处理工艺与组织形成过程",h:"加热→保温→冷却全过程",

 {t:"硬度测试是多少？是否达标？分析原因",h:"对照行业标准判断",
  a:"实测 <b>48HRC</b>，JB/T 6609-2021 规定有效厚度10~20mm油淬样品表层硬度45~52HRC，<b>达标</b>。<br>原因：①马氏体固溶强化；②板条马氏体高密度位错；③马氏体细晶强化；④孪晶马氏体微细孪晶进一步提高硬度；⑤屈氏体片层间距小（30~80nm），细晶强化+渗碳体片层提供较高硬度；⑥上贝氏体硬度略高于屈氏体。大量板条马氏体+少量针片马氏体+屈氏体+上贝氏体形成较高硬度的复杂组织。"},
 {t:"热处理工艺与组织形成过程",h:"油冷冷速不足带来的混合组织",
  a:"<b>工艺：油淬</b>。840~860℃保温15~30min，奥氏体化后油冷。<br>形成过程：①加热奥氏体化。②油冷淬火，冷速处于马氏体临界冷速附近：样品外部冷速高马氏体占比高，向内冷速降低屈氏体增多；心部含碳量高（更接近共析成分）、临界冷速更低，马氏体反而更多；屈氏体沿晶界分布（晶界扩散快、形核功低、碳偏聚）。③极少量上贝氏体：冷却经过350~550℃区间时冷速较慢（淬火油温度较高或牌号粘度大冷速低）。④整体Ms点低于室温，存在亚稳残余奥氏体。<br>组织特征：心部沿晶界少量屈氏体+混合马氏体（晶粒粗大）；向外网状屈氏体增多再减少；近边缘屈氏体+混合马氏体；深黑色半羽毛状上贝氏体由晶界向晶内延伸（含量极少）；边缘轻微脱碳。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"该样品<b>未低温回火</b>，内应力大；存在少量不完全形态的半羽毛状上贝氏体，上贝氏体铁素体与屈氏体沿晶界分布降低强度；组织与硬度分布不均匀，<b>均不合格</b>。<br>工艺改进：热锻/热轧均匀成分，高温扩散退火 + 正火细化晶粒，油淬后低温回火。<br>用途：<b>汽车连杆、承受中等载荷的轴</b>。"}]},

  a:"<b>工艺：淬火+低温回火</b>。840~860℃保温15~30min水冷淬火，200℃保温1~2h回火。<br>形成过程：淬火得到板条马氏体+高碳微区针片马氏体+少量残余奥氏体；回火加热时部分残余奥氏体转变为马氏体，马氏体中过饱和碳析出，形成<b>回火马氏体</b>，内部分散极弥散细小的ε碳化物，腐蚀后颜色偏深。<br>组织特征：回火板条马氏体板条平行呈深色，一个原奥氏体晶粒内多个板条束群；少量边缘尖锐回火针片马氏体（含量少难分辨）；极少量浅色残余奥氏体无明显边界；边缘轻微脱碳层。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并举例",
  a:"45钢淬火+低温回火后组织为回火马氏体，强度、硬度、耐磨性高且保持一定韧性，可用于承受中等载荷和转速的轴。该样品工艺合格、组织均匀、硬度达标，<b>整体合格</b>。<br>用途举例：<b>机床主轴、传动轴、汽车半轴、汽车齿轮、连杆</b>。"}]},

 {t:"热处理工艺与组织形成过程",h:"中温回火的碳化物演变",
  a:"<b>工艺：淬火+中温回火</b>。因硬度偏低，推测840~860℃保温15~30min水冷后，在500℃保温超过2h或温度略高于500℃回火。<br>形成过程：淬火得到板条马氏体+针片马氏体+少量残余奥氏体；中温回火时依次发生：过饱和碳析出→碳原子在位错线附近偏聚→ε碳化物→χ碳化物→θ碳化物；因温度偏高或时间偏长，碳化物略微球化，形成<b>回火屈氏体</b>。残余奥氏体部分转变为马氏体，少量通过切变+扩散混合机制形成下贝氏体、分解为回火屈氏体。<br>组织特征：铁素体板条内部和界面上弥散分布极细小θ碳化物，保持部分马氏体形态，板条状铁素体内部存在高密度位错。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"回火温度可能达到520℃或保温时间过长，碳化物球化导致硬度偏低（低于行业35~45HRC范围），<b>不达标</b>。<br>工艺改进：重新奥氏体化后淬火+中温回火，回火温度控制在<b>350~500℃</b>、保温<b>1~2h</b>。<br>用途：合格件可用作<b>小型弹簧</b>等弹性零件。"}]},

 {t:"热处理工艺与组织形成过程",h:"调质处理与过回火现象",
  a:"<b>工艺：淬火+高温回火（调质）</b>。因硬度偏低，推测回火温度高于650℃或保温时间太久。<br>形成过程：淬火得到板条马氏体+针片马氏体+少量残余奥氏体；高温回火时依次发生：过饱和碳析出→位错偏聚→ε碳化物→χ碳化物→θ碳化物→渗碳体聚集长大（奥斯特瓦尔德熟化）；因温度偏高或时间偏长，基体完全丧失马氏体形态，铁素体重新形核长大为游离块状铁素体，形成<b>回火索氏体</b>。残余奥氏体部分转马氏体、少量形成下贝氏体、分解为回火索氏体。<br>组织特征：左半部分为游离块状铁素体+渗碳体颗粒（完全丧失马氏体形态）；右半部分为铁素体基体+颗粒碳化物的回火索氏体。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"回火温度偏高或保温时间较长，出现游离块状铁素体，硬度偏低；且因加热不均、原始组织不均、应力分布异常，硬度和组织分布不均匀，<b>不合格</b>。<br>工艺改进：热锻/热轧使组织均匀后淬火+高温回火，注意回火温度不可过高、保温时间不可过久。<br>用途：合格调质件用于<b>中低载荷连杆、普通传动轴、机床主轴、高强度螺栓/销</b>等。"}]},

  a:"实测 <b>73HRB</b>，JB/T 6609-2021 规定T12钢热轧后硬度在97HRB以上、25HRC以下，<b>不达标</b>。<br>原因：①始轧温度高出现石墨碳，石墨强度极低且具润滑性，可视作孔洞；②终轧温度过高或变形量不足出现球状珠光体，其塑性韧性好但硬度低于层片状珠光体，整体硬度偏低。"},
 {t:"热处理工艺与组织形成过程",h:"过热轧制与石墨化",
  a:"<b>工艺：过热轧制</b>。推测始轧温度高于1200℃，终轧温度高于900℃。<br>形成过程：终轧温度过高，奥氏体晶粒二次再结晶长大至数百微米级；缓慢冷却中沿粗大奥氏体晶界析出粗大网状二次渗碳体；因变形量不足、晶内缺陷少且冷却极慢，部分高碳区发生<b>石墨化转变</b>（渗碳体→铁素体+石墨），石墨沿原奥氏体晶界呈团絮状析出（热力学自发、动力学需极慢冷速或杂质促进）；剩余奥氏体在Ar1以下转变为粗片状珠光体。<br>组织特征：深色粗片状珠光体基体（晶粒数百微米）；白色粗网状二次渗碳体沿晶界分布（网宽且连续）；黑色团絮状石墨沿晶界分布；边缘脱碳发白。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"过热轧制组织存在石墨化、粗大网状碳化物和粗大珠光体，性能极差，<b>完全无工程价值，属严重不合格品</b>。<br>工艺改进：严格控制轧制温度和终轧后冷速，多次正火+球化退火细化组织（如780℃球化退火）。<br>因T12价格低廉、补救成本高，<b>直接报废处理即可</b>；正常用途为车刀、钻头、铣刀、小型冲孔模具。"}]},

 {t:"热处理工艺与组织形成过程",h:"球化退火的渗碳体球化机制",
  a:"<b>工艺：球化退火</b>。加热至750~770℃保温约90min，炉冷至690~700℃等温6~8h。<br>形成过程：①加热保温：750~770℃时珠光体中铁素体开始转变为奥氏体，渗碳体未完全溶解，薄片发生<b>颈缩、局部熔断</b>，二次渗碳体钝化。②等温阶段：冷至680~700℃，过冷奥氏体分解形成铁素体，界面能降低，渗碳体<b>球化</b>。<br>组织特征：①铁素体基体上分布球状碳化物，极少量片状珠光体，沿原奥氏体晶界分布短棒状碳化物；②圆心碳含量高、渗碳体偏多，边缘轻微脱碳、渗碳体偏少。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并举例",

  a:"实测 <b>97HRB</b>，GB/T 1298-2008 要求退火态硬度89~94HRB，<b>略高于标准，不达标</b>。<br>原因：①渗碳体金属间化合物硬度800HV以上，与铁素体组成片层机械混合物（珠光体）硬度较高；②珠光体片层较细，硬度略高（晶粒较粗大略抵消）；③沿晶界析出的网状二次渗碳体硬度极高；④圆心碳含量较高。"},
 {t:"热处理工艺与组织形成过程",h:"过共析钢完全退火与网状渗碳体",
  a:"<b>工艺：退火（完全退火）</b>。840~860℃保温约30~45min（按t=αKD估算），随炉缓冷。<br>形成过程：①加热至Ac1以上奥氏体形核长大，继续加热至Accm以上，残余渗碳体溶解、成分均匀化；推测保温较长，晶粒略粗大。②缓冷至Arcm以下，奥氏体晶界连续不均匀脱溶形成<b>网状二次渗碳体</b>；冷至Ar1以下，奥氏体内碳下坡扩散，共析转变形成珠光体型组织。<br>组织特征：①珠光体约3~4级晶粒度、等轴状，部分片层较细（属索氏体范畴）；②沿晶界白色网状二次渗碳体；③圆心碳高、二次渗碳体偏多，边缘轻微脱碳、片层更细。"},
 {t:"综合分析：工艺、组织、硬度与工程价值",h:"判断是否合格并提出改进",
  a:"退火时可能温度过高或保温过久、随炉冷速略快，导致组织分布不均匀、珠光体晶粒粗大且片层偏细，整体硬度偏高，<b>不达标</b>。<br>工艺改进：热锻/热轧后重新退火，注意加热温度不过高、冷速不过快。<br>用途：作为淬火态原材料，淬火+低温回火后用作<b>锯片、锉刀</b>。"}]},

/* ============ SRS engine (simplified SM-2) ============ */
const STORE_KEY='jx_srs_v1';
const DAY=86400000;
let store=load();
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw)return JSON.parse(raw);
  }catch(e){}
  const s={};DATA.forEach((d,i)=>{s[i]={ease:2.5,ivl:0,due:0,reps:0,lapses:0}});
  return s;
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(e){}}
function fmtIvl(ms){
  const d=ms/DAY;
  if(d<1/24)return Math.max(1,Math.round(ms/60000))+'分钟';
  if(d<1)return Math.round(d*24)+'小时';
  if(d<30)return Math.round(d)+'天';
  return (d/30).toFixed(1)+'个月';
}
function rate(i,r){
  const c=store[i];const now=Date.now();
  c.reps++;
  if(r===0){ // again
    c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.ivl=0;c.due=now+10*60000;
  }else if(r===1){ // hard
    c.ease=Math.max(1.3,c.ease-0.05);
    c.ivl=(c.ivl===0?1:Math.max(1,Math.round(c.ivl*1.2)))*DAY;
    c.due=now+c.ivl;
  }else if(r===2){ // good
    c.ivl=(c.ivl===0?3:Math.round(c.ivl*c.ease))*DAY;
    c.due=now+c.ivl;
  }else{ // easy
    c.ease=Math.min(3.2,c.ease+0.15);
    c.ivl=(c.ivl===0?7:Math.round(c.ivl*c.ease*1.3))*DAY;
    c.due=now+c.ivl;
  }
  save();updateStats();
}
function isDue(c){return c.reps===0||c.due<=Date.now()}
function masteredCount(){return DATA.filter((_,i)=>store[i].ivl>=7*DAY).length}

/* ============ view switching ============ */
const views={'srs':null,'deck':null,'browse':null};
let curView='srs';
function switchView(v){
  curView=v;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+v).classList.add('active');
  ['srs','deck','browse'].forEach(k=>{
    document.getElementById('view-'+k).classList.toggle('show',k===v);
  });
  if(v==='srs')renderSRS();
  if(v==='deck')renderDeck();
  if(v==='browse')render(cur);
}
document.getElementById('tab-srs').addEventListener('click',()=>switchView('srs'));
document.getElementById('tab-deck').addEventListener('click',()=>switchView('deck'));
document.getElementById('tab-browse').addEventListener('click',()=>switchView('browse'));

/* ============ stats ============ */
function updateStats(){
  const due=DATA.filter((_,i)=>isDue(store[i])).length;
  const m=masteredCount();
  const started=DATA.filter((_,i)=>store[i].reps>0).length;
  document.getElementById('stDue').textContent=due;
  document.getElementById('stMastered').textContent=m;
  document.getElementById('stLearning').textContent=started-m;
  document.getElementById('stNew').textContent=DATA.length-started;
}

/* ============ SRS queue & card ============ */
let queue=[],qpos=0,revealed=false;
function buildQueue(shuffleOnlyDue){
  let idx=DATA.map((_,i)=>i).filter(i=>isDue(store[i]));
  if(idx.length===0)idx=DATA.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  queue=idx;qpos=0;revealed=false;
}
function renderSRS(){
  updateStats();
  if(qpos>=queue.length){
    document.getElementById('front').style.display='none';
    document.getElementById('answers').classList.remove('show');
    document.getElementById('done').classList.add('show');
    document.getElementById('rate').classList.remove('show');
    document.getElementById('posLabel').textContent='本轮 '+queue.length+' 张卡片完成';
    return;
  }
  document.getElementById('done').classList.remove('show');
  document.getElementById('front').style.display='flex';
  document.getElementById('answers').classList.remove('show');
  document.getElementById('rate').classList.remove('show');
  revealed=false;
  const i=queue[qpos],d=DATA[i],c=store[i];
  document.getElementById('cSteel').textContent=(qpos+1)+'/'+queue.length+' · '+d.s;
  document.getElementById('cHard').textContent=d.h;
  const p=document.getElementById('cPass');p.textContent=d.pt;p.className='pill '+d.pass;
  const iv=document.getElementById('cIvl');
  if(c.reps===0)iv.textContent='新卡片';
  else if(c.due<=Date.now())iv.textContent='已到期 · 上次间隔 '+fmtIvl(c.ivl||1);
  else iv.textContent='提前复习 · 下次 '+fmtIvl(c.due-Date.now());
  document.getElementById('qwalk').innerHTML=d.qs.map((q,j)=>
    '<div class="qw"><span class="qn">Q'+(j+1)+'</span><span><span class="qt">'+q.t+'</span><br><span class="qh">'+q.h+'</span></span></div>').join('');
  document.getElementById('answers').innerHTML=d.qs.map((q,j)=>
    '<div class="asec"><div class="at">Q'+(j+1)+' · '+q.t+'</div>'+q.a+'</div>').join('');
  document.getElementById('posLabel').textContent='队列剩余 '+ (queue.length-qpos) +' 张';
  // preview intervals for good/easy buttons
  const g=document.getElementById('gIvl'),e=document.getElementById('eIvl');
  const nc={ease:c.ease,ivl:c.ivl};
  const gI=nc.ivl===0?3:Math.round(nc.ivl*nc.ease);
  const eI=nc.ivl===0?7:Math.round(nc.ivl*nc.ease*1.3);
  g.textContent=fmtIvl(gI*DAY);e.textContent=fmtIvl(eI*DAY);
}
function doFlip(){
  if(qpos>=queue.length)return;
  revealed=!revealed;
  document.getElementById('front').style.display=revealed?'none':'flex';
  document.getElementById('answers').classList.toggle('show',revealed);
  document.getElementById('rate').classList.toggle('show',revealed);
}
document.getElementById('flipArea').addEventListener('click',e=>{
  if(e.target.closest('.flipbtn')||e.target.closest('.rate')||e.target.closest('.done'))return;
  doFlip();
});
document.getElementById('flipBtn').addEventListener('click',e=>{e.stopPropagation();doFlip();});
document.querySelectorAll('.rate button').forEach(b=>{
  b.addEventListener('click',e=>{
    e.stopPropagation();
    if(qpos>=queue.length)return;
    rate(queue[qpos],+b.dataset.r);
    qpos++;revealed=false;renderSRS();
  });
});
document.getElementById('skipBtn').addEventListener('click',()=>{
  if(qpos<queue.length){queue.push(queue[qpos]);qpos++;revealed=false;renderSRS();}
});
document.getElementById('againBtn').addEventListener('click',()=>{buildQueue();renderSRS();});
document.addEventListener('keydown',e=>{
  if(curView!=='srs')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();doFlip();}
  if(revealed&&qpos<queue.length){
    if(e.key==='1')document.querySelector('.rate .again').click();
    if(e.key==='2')document.querySelector('.rate .hard').click();
    if(e.key==='3')document.querySelector('.rate .good').click();
    if(e.key==='4')document.querySelector('.rate .easy').click();
  }
});

/* ============ deck mastery list ============ */
function renderDeck(){
  const el=document.getElementById('decklist');
  el.innerHTML=DATA.map((d,i)=>{
    const c=store[i];
    const m=Math.min(100,Math.round(c.ivl/(21*DAY)*100));
    const due=c.reps===0?'新':(isDue(c)?'已到期':fmtIvl(c.due-Date.now())+'后');
    const chip=c.reps===0?'<span class="duechip later">未开始</span>'
      :(isDue(c)?'<span class="duechip due">待复习</span>':'<span class="duechip later">'+due+'</span>');
    const ms=c.reps===0?'—':(m>=100?'已掌握':m+'%');
    return '<div class="drow"><span class="dn">'+(i+1)+'</span><span class="ds">'+d.s+' · '+d.h+'</span>'
      +chip+'<span class="dm"><div class="mbar"><i style="width:'+m+'%"></i></div></span><span class="mstat">'+ms+'</span></div>';
  }).join('');
}

/* ============ browse mode: free steel selection ============ */
const $=id=>document.getElementById(id);
let cur=0,opened={};
function buildGrid(){
  $('steelGrid').innerHTML=DATA.map((d,i)=>
    '<button data-i="'+i+'">'+d.s+'<small>'+d.h+' · '+d.pt+'</small></button>').join('');
  $('steelGrid').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>render(+b.dataset.i));
  });
}
function render(i){
  cur=i;const d=DATA[i];
  $('steelGrid').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));
  $('steelName').textContent=d.s;
  $('hardness').textContent=d.h;
  const pill=$('passPill');
  pill.textContent=d.pt;
  pill.className='pill '+d.pass;
  $('progress').textContent='第 '+(i+1)+' / '+DATA.length+' 题';
  $('qlist').innerHTML=d.qs.map((q,j)=>
    '<div class="qsec"><div class="qhead"><div><div class="qnum">Q'+(j+1)+'</div>'+
    '<div class="qtitle">'+q.t+'</div><div class="qhint">💭 默念提示：'+q.h+'</div></div></div>'+
    '<div class="answer open"><div class="inner">'+q.a+'</div></div></div>').join('');
  window.scrollTo({top:0,behavior:'smooth'});
}
buildGrid();
render(0);

/* reset */
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('确定重置全部复习进度？此操作不可恢复。')){
    try{localStorage.removeItem(STORE_KEY)}catch(e){}
    store=load();buildQueue();renderSRS();
    if(curView==='deck')renderDeck();
  }
});

/* init */
buildQueue();
renderSRS();
</script>
